---
name: Deploy

"on":
  push:
    branches: [main]
    paths:
      - "stack/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-uptime-kuma
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer GitOps webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: curl --fail --show-error --silent --request POST "$PORTAINER_WEBHOOK_URL"
