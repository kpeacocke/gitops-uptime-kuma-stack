---
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    tag: "{{.Name}}"

services:
  uptime-kuma:
    image: 'louislam/uptime-kuma:2'
    container_name: uptime-kuma
    environment:
      - TZ=${TZ:-Australia/Sydney}
    # Host networking lets Kuma monitor the NAS loopback-only service ports
    # without hairpinning through Cloudflare and the Synology reverse proxy.
    network_mode: host
    volumes:
      - '${UPTIME_KUMA_DATA_PATH:?Set UPTIME_KUMA_DATA_PATH in .env}:/app/data'
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
